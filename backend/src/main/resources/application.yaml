spring:
  application:
    name: wakewise

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:wakewise}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

  quartz:
    job-store-type: memory

server:
  port: 8080

wakewise:
  jwt:
    # 生产环境务必通过环境变量注入强随机密钥（>= 32 字节）
    secret: ${JWT_SECRET:wakewise-dev-only-secret-key-change-me-0123456789}
    ttl-minutes: 720
  nightly-plan-cron: "${WAKEWISE_NIGHTLY_PLAN_CRON:0 0 22 * * ?}"
  default-zone: Asia/Shanghai
  decision:
    safety-buffer-minutes-balanced: 5
    safety-buffer-minutes-conservative: 8
    safety-buffer-minutes-sleep-first: 3
    auto-arm-max-advance-minutes: 30
  behavior:
    # 起床延迟校准（SHRINK_V1）：样本不足 min-samples 时保持固定先验 4/8 分钟
    min-samples: 5
    shrinkage-k: 5
    max-samples: 30          # 需 <= 50（Repository 固定取最近 50 条）
    max-latency-minutes: 60  # 单条样本截断上限（开着闹钟人不在等病态样本）
  llm:
    # 解释文案 LLM 增强（OpenAI 兼容端点，用户可配；base-url/api-key/model 留空即不启用，纯模板文案）
    # base-url 给到 /v1 为止，常用示例：
    #   DeepSeek  https://api.deepseek.com/v1                        model: deepseek-chat
    #   OpenAI    https://api.openai.com/v1                          model: gpt-4o-mini
    #   通义      https://dashscope.aliyuncs.com/compatible-mode/v1  model: qwen-plus
    #   Kimi      https://api.moonshot.cn/v1                         model: moonshot-v1-8k
    base-url: ${LLM_BASE_URL:}
    api-key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:}
    connect-timeout-ms: ${LLM_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${LLM_READ_TIMEOUT_MS:5000}
    max-chars: ${LLM_MAX_CHARS:300}
  amap:
    # 高德 Web 服务 key（lbs.amap.com 个人开发者注册，选"Web 服务"类型）；留空即不启用真实 ETA，
    # 通勤时长回落用户手填分钟。地址→坐标在建闹钟/设常驻地址时缓存，路径规划结果缓存 2 小时。
    key: ${AMAP_KEY:}

# API 文档(knife4j):http://localhost:8080/doc.html
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    com.wjh.wakewise: INFO
